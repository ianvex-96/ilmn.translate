name: Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Build debug
      run: |
        cd ${{ github.workspace }}
        chmod +x gradlew
        ./gradlew assembleDebug
